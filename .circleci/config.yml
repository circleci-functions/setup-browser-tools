version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The install jobs exec the binary `build` cross-compiled, so they run on bare
  # images rather than language-preinstalled ones.
  debian:
    docker:
      - image: cimg/base:current
  alpine:
    docker:
      - image: alpine:3.21
  rhel:
    docker:
      - image: rockylinux:9
  macos:
    macos:
      xcode: 16.2.0

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-browser-tools-go-{{ checksum "go.sum" }}-
            - setup-browser-tools-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-browser-tools-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-browser-tools into ./dist and persists it to the
  # workspace, so the install jobs exercise exactly what `publish` is about to
  # ship rather than a previously published artifact.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-browser-tools-go-{{ checksum "go.sum" }}-
            - setup-browser-tools-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real installs against real images. Nothing else in this repo executes an
  # install: the unit tests assert against the same reading of the orb that let
  # its own missing-else branches survive, so this is the only thing that can
  # catch "exited 0, installed nothing".
  #
  # Every row asserts the installed binary reports a version. An exit code alone
  # is not evidence.
  install-debian-chrome:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chrome reports a version
          command: |
            google-chrome --version
            google-chrome --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-alpine-chrome:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome resolves to Chromium on Alpine
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chromium reports a version
          command: |
            chromium-browser --version
            chromium-browser --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-debian-default-set:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-browser-tools
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools
      - run:
          name: Assert all four binaries respond
          command: |
            google-chrome --version
            chromedriver --version
            firefox --version
            geckodriver --version

  # The warn-and-skip path. Firefox and geckodriver are on by default and
  # unsupported here, so this must exit 0 having installed Chrome and
  # ChromeDriver, and must say why it skipped the other two.
  install-alpine-default-set:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-browser-tools skips what Alpine cannot support
          command: |
            ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools 2>&1 | tee /tmp/alpine.log
      - run:
          name: Assert it warned rather than failed
          command: |
            grep -q "skipping Firefox" /tmp/alpine.log
            grep -q "skipping geckodriver" /tmp/alpine.log
      - run:
          name: Assert Chromium and its driver still work
          command: |
            chromium-browser --version
            chromedriver --version

  # Explicitly asking for an unsupported component must fail, unlike the row
  # above where the same component was only on by default.
  install-alpine-explicit-firefox-fails:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: An explicit --firefox on Alpine must fail
          command: |
            if ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools \
                 --firefox --no-chrome --no-chromedriver --no-geckodriver; then
              echo "FAIL: an explicitly requested Firefox should not have succeeded on Alpine" >&2
              exit 1
            fi

  install-rhel-chrome:
    executor: rhel
    steps:
      - run: dnf install -y git tar gzip which
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome via yum
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chrome reports a version
          command: google-chrome --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-macos-chrome:
    executor: macos
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome then install-chromedriver
          command: |
            BIN=./dist/setup-browser-tools/darwin/arm64/setup-browser-tools
            "$BIN" install-chrome
            "$BIN" install-chromedriver
      - run:
          name: Assert both report versions
          command: |
            google-chrome --version
            chromedriver --version

  install-debian-opt-in-set:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-edge then install-edge-driver
          command: |
            BIN=./dist/setup-browser-tools/linux/amd64/setup-browser-tools
            "$BIN" install-edge
            "$BIN" install-edge-driver
      - run:
          name: Assert Edge and its driver report versions
          command: |
            microsoft-edge --version
            msedgedriver --version
      - run:
          name: install-chrome-for-testing with its driver
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome-for-testing
      - run:
          name: Assert Chrome for Testing and its driver report versions
          command: |
            chrome --version
            chromedriver --version

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-browser-tools-go-{{ checksum "go.sum" }}-
            - setup-browser-tools-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      # None of these gate publish yet. Once the matrix has been green for a full
      # run, install-debian-chrome and install-alpine-chrome are added to
      # publish's requires — those two cover the path with a real internal caller
      # and the warn-and-skip behaviour respectively. The tag filters are already
      # in place on those two so that promotion needs no further change.
      - install-debian-chrome:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - install-alpine-chrome:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - install-debian-default-set:
          requires: [build]
          context: [github-readonly]
      - install-alpine-default-set:
          requires: [build]
          context: [github-readonly]
      - install-alpine-explicit-firefox-fails:
          requires: [build]
          context: [github-readonly]
      - install-rhel-chrome:
          requires: [build]
          context: [github-readonly]
      - install-macos-chrome:
          requires: [build]
          context: [github-readonly]
      - install-debian-opt-in-set:
          requires: [build]
          context: [github-readonly]
      - publish:
          requires: [test, build]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
