version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The install jobs exec the binary `build` cross-compiled, so they run on bare
  # images rather than language-preinstalled ones.
  debian:
    docker:
      - image: cimg/base:current
  alpine:
    docker:
      - image: alpine:3.21
  rhel:
    docker:
      - image: rockylinux:9
  macos:
    macos:
      xcode: 16.2.0

commands:
  acceptance:
    description: >-
      Run tests from the cross-compiled acceptance suite against the
      cross-compiled binary, both from the workspace, so the executor needs no
      Go and no checkout. The job's own cache stands in for the in-memory one.
    parameters:
      platform:
        type: string
        default: linux/amd64
        description: The os/arch whose artifacts to run, e.g. linux/arm64.
      run:
        type: string
        description: The tests to run, as a -test.run pattern.
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Acceptance << parameters.run >>
          command: ./dist/acceptance/<< parameters.platform >>/acceptance -test.v -test.timeout 30m -test.run '<< parameters.run >>'
          environment:
            SETUP_BROWSER_TOOLS_BINARY: ./dist/setup-browser-tools/<< parameters.platform >>/setup-browser-tools
            # The suite fails rather than falling back if it cannot reach it.
            TOOLKIT_CACHE_MODE: live

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-browser-tools-go-{{ checksum "go.sum" }}-
            - setup-browser-tools-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-browser-tools-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-browser-tools into ./dist and persists it to the
  # workspace, so the install jobs exercise exactly what `publish` is about to
  # ship rather than a previously published artifact.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-browser-tools-go-{{ checksum "go.sum" }}-
            - setup-browser-tools-go-
      - run: task dry-run
      # The acceptance suite as a binary, so an install job needs no Go.
      - run: task build-acceptance
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Runs the acceptance suite. New install behaviour is covered by a test in
  # acceptance/ and a row that runs it, rather than by a bash row like those
  # below.
  acceptance-debian-geckodriver:
    executor: debian
    steps:
      - acceptance:
          run: TestAcceptanceGeckodriver

  # Each test checks the display from a fresh process after the function's has
  # exited, which is what a later step is, so Xvfb outliving its step is part of
  # what passes. The headed-browser test runs Chrome here and Chromium on Alpine.
  acceptance-debian-xvfb:
    executor: debian
    steps:
      - acceptance:
          run: TestAcceptanceXvfb

  acceptance-alpine-xvfb:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - acceptance:
          run: TestAcceptanceXvfb

  # Real installs against real images. Nothing else in this repo executes an
  # install: the unit tests assert against the same reading of the orb that let
  # its own missing-else branches survive, so this is the only thing that can
  # catch "exited 0, installed nothing".
  #
  # Every row asserts the installed binary reports a version. An exit code alone
  # is not evidence.
  install-debian-chrome:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chrome reports a version
          command: |
            google-chrome --version
            google-chrome --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-alpine-chrome:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome resolves to Chromium on Alpine
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chromium reports a version
          command: |
            chromium-browser --version
            chromium-browser --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-debian-default-set:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-browser-tools
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools
      - run:
          name: Assert all four binaries respond
          command: |
            google-chrome --version
            chromedriver --version
            firefox --version
            geckodriver --version

  # The warn-and-skip path. Firefox is on by default and unsupported here, so
  # this must exit 0 having installed everything else and said why it skipped
  # Firefox. geckodriver's linux64 build does run on Alpine — verified here
  # rather than assumed.
  install-alpine-default-set:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-browser-tools skips what Alpine cannot support
          command: |
            ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools 2>&1 | tee /tmp/alpine.log
      - run:
          name: Assert it warned rather than failed
          command: |
            grep -q "skipping Firefox" /tmp/alpine.log
      - run:
          name: Assert everything Alpine does support still works
          command: |
            chromium-browser --version
            chromedriver --version
            geckodriver --version

  # Explicitly asking for an unsupported component must fail, unlike the row
  # above where the same component was only on by default.
  install-alpine-explicit-firefox-fails:
    executor: alpine
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: An explicit --firefox on Alpine must fail
          command: |
            if ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-browser-tools \
                 --firefox --no-chrome --no-chromedriver --no-geckodriver; then
              echo "FAIL: an explicitly requested Firefox should not have succeeded on Alpine" >&2
              exit 1
            fi

  install-alpine-arm64-default-set:
    executor: alpine
    resource_class: arm.medium
    steps:
      - run: apk add --no-cache bash git curl
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-browser-tools on Alpine arm64
          command: |
            ./dist/setup-browser-tools/linux/arm64/setup-browser-tools install-browser-tools 2>&1 | tee /tmp/alpine.log
      - run:
          name: Assert it skipped only Firefox
          command: |
            grep -q "skipping Firefox" /tmp/alpine.log
            chromium-browser --version
            chromedriver --version
            geckodriver --version

  install-debian-arm64-geckodriver:
    executor: debian
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-geckodriver on Debian arm64
          command: ./dist/setup-browser-tools/linux/arm64/setup-browser-tools install-geckodriver
      - run:
          name: Assert geckodriver reports a version
          command: geckodriver --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-rhel-chrome:
    executor: rhel
    steps:
      - run: dnf install -y git tar gzip which
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome via yum
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome
      - run:
          name: Assert Chrome reports a version
          command: google-chrome --version | grep -E '[0-9]+\.[0-9]+\.[0-9]+'

  install-debian-bare-firefox-edge:
    docker:
      - image: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-firefox and install-edge without gpg
          command: |
            if command -v gpg; then
              echo "FAIL: this image is meant to start without gpg" >&2
              exit 1
            fi
            BIN=./dist/setup-browser-tools/linux/amd64/setup-browser-tools
            "$BIN" install-firefox
            "$BIN" install-edge
      - run:
          name: Assert Firefox and Edge report versions
          command: |
            firefox --version
            microsoft-edge --version

  install-macos-chrome:
    executor: macos
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-chrome then install-chromedriver
          command: |
            BIN=./dist/setup-browser-tools/darwin/arm64/setup-browser-tools
            "$BIN" install-chrome
            "$BIN" install-chromedriver
      - run:
          name: Assert both report versions
          command: |
            google-chrome --version
            chromedriver --version

  install-macos-edge:
    executor: macos
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-edge, which uses brew
          command: ./dist/setup-browser-tools/darwin/arm64/setup-browser-tools install-edge
      - run:
          name: Assert Edge reports a version
          command: '"/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --version'

  install-debian-opt-in-set:
    executor: debian
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: install-edge then install-edge-driver
          command: |
            BIN=./dist/setup-browser-tools/linux/amd64/setup-browser-tools
            "$BIN" install-edge
            "$BIN" install-edge-driver
      - run:
          name: Assert Edge and its driver report versions
          command: |
            microsoft-edge --version
            msedgedriver --version
      - run:
          name: install-chrome-for-testing with its driver
          command: ./dist/setup-browser-tools/linux/amd64/setup-browser-tools install-chrome-for-testing
      - run:
          name: Assert Chrome for Testing and its driver report versions
          command: |
            chrome --version
            chromedriver --version

workflows:
  test-publish:
    jobs:
      - test
      - build
      # install-debian-chrome and install-alpine-chrome gate publish: they cover
      # the path with a real internal caller and the Chromium-on-musl path
      # respectively. Promoted after the whole matrix went green in a full run.
      #
      # The remaining rows run and report but do not gate, so a flaky upstream
      # mirror cannot block a release. CircleCI has no per-job advisory status, so
      # a failure there still shows red on a PR; making these two *required* for
      # merge is a branch-protection setting, not something this config expresses.
      - install-debian-chrome:
          requires: [build]
      - install-alpine-chrome:
          requires: [build]
      - install-debian-default-set:
          requires: [build]
      - install-alpine-default-set:
          requires: [build]
      - install-alpine-explicit-firefox-fails:
          requires: [build]
      - install-alpine-arm64-default-set:
          requires: [build]
      - install-debian-arm64-geckodriver:
          requires: [build]
      - install-rhel-chrome:
          requires: [build]
      - install-debian-bare-firefox-edge:
          requires: [build]
      - install-macos-chrome:
          requires: [build]
      - install-macos-edge:
          requires: [build]
      - install-debian-opt-in-set:
          requires: [build]
      - acceptance-debian-geckodriver:
          requires: [build]
      - acceptance-debian-xvfb:
          requires: [build]
      - acceptance-alpine-xvfb:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-browser-tools-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires [test, build, install-debian-chrome, install-alpine-chrome]
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-browser-tools-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
